<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ML Earthquake Detection - 模型正確率比較</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f7f7f7; margin: 0; }
        header { background: #2d3e50; color: #fff; padding: 2rem 1rem; text-align: center; }
        main { max-width: 900px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07);}
        h1, h2 { margin-top: 0; }
        section { margin-bottom: 2.5rem; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid #bbb; padding: 0.7em 1em; text-align: center; }
        th { background: #e3eaf2; }
        tr:nth-child(even) { background: #f7f7f7; }
        .caption { font-size: 0.95em; color: #555; margin-top: 0.5em; }
        footer { text-align: center; color: #888; margin: 2rem 0 1rem 0; }
    </style>
</head>
<body>
    <header>
        <h1>ML Earthquake Detection</h1>
        <p>三種模型正確率比較</p>
    </header>
    <main>
        <section>
            <h2>模型正確率統計表</h2>
            <table>
                <thead>
                    <tr>
                        <th>模型名稱</th>
                        <th>驗證集正確率</th>
                        <th>測試集正確率</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1D CNN</td>
                        <td>92.3%</td>
                        <td>91.8%</td>
                    </tr>
                    <tr>
                        <td>1D RNN</td>
                        <td>90.7%</td>
                        <td>90.2%</td>
                    </tr>
                    <tr>
                        <td>I_CNN (改良型CNN)</td>
                        <td>93.5%</td>
                        <td>93.0%</td>
                    </tr>
                </tbody>
            </table>
            <div class="caption">
                *以上數值僅為範例，請依實際訓練結果填寫。
            </div>
        </section>
        <section>
            <h2>成果展示</h2>
            <ul>
                <li>各模型混淆矩陣與波形分類成果請參見下方圖示。</li>
            </ul>
        </section>
    </main>
    <footer>
        &copy; 2025 ML Earthquake Detection Project
    </footer>
</body>
</html>
